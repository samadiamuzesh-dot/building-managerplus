<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ورود | آپارتمان پلاس</title>
  <link rel="stylesheet" href="css/style.css?v=999">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #5b4cdb 0%, #4338ca 100%);
      padding: 20px;
    }

    .login-box {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-brand svg {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      margin-bottom: 10px;
      box-shadow: 0 8px 24px rgba(91, 76, 219, 0.3);
    }

    .login-brand h1 {
      font-size: 22px;
      font-weight: 900;
      color: #5b4cdb;
      margin-bottom: 4px;
    }

    .login-brand p {
      font-size: 13px;
      color: #64748b;
    }

    /* تب‌ها */
    .login-tabs {
      display: flex;
      gap: 6px;
      background: #f8fafc;
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 22px;
      border: 1px solid #e2e8f0;
    }

    .login-tab {
      flex: 1;
      padding: 11px 14px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .login-tab:hover {
      background: #eef2ff;
      color: #5b4cdb;
    }

    .login-tab.active {
      background: #5b4cdb;
      color: #fff;
    }

    .login-tab-content {
      display: none;
    }

    .login-tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-box .form-group {
      margin-bottom: 16px;
    }

    .login-box .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
    }

    .login-box .form-input {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14.5px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    .login-box .form-input:focus {
      border-color: #5b4cdb;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(91, 76, 219, 0.1);
    }

    .login-box .form-input.input-error {
      border-color: #ef4444 !important;
      background: #fef2f2 !important;
    }

    .login-error-msg {
      font-size: 12px;
      color: #ef4444;
      margin-top: 6px;
      font-weight: 600;
      display: none;
    }

    .login-error-msg.show {
      display: block;
    }

    .login-submit-btn {
      width: 100%;
      padding: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #5b4cdb 0%, #4338ca 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
    }

    .login-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(91, 76, 219, 0.35);
    }

    .login-footer-text {
      text-align: center;
      font-size: 12.5px;
      color: #94a3b8;
      margin-top: 18px;
    }

    .login-footer-text a {
      color: #5b4cdb;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    /* چک‌باکس نمایش رمز */
    .show-pass-wrapper {
      position: relative;
    }

    .show-pass-btn {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }
  </style>
</head>
<body>

  <div class="login-page">
    <div class="login-box">

      <div class="login-brand">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
          <rect width="512" height="512" rx="110" fill="#5b4cdb"/>
          <path d="M370 380H142V200c0-8 5-15 12-17l140-33c6-1 12 0 17 3s8 9 8 15v212zM392 165c0-6 4-12 9-15s12-4 18-2l48 11c8 2 13 9 13 17v204h-88V165zM320 80c0-7 5-12 12-12h72c7 0 12 5 12 12v64h-96V80z"
                fill="#ffffff"/>
          <rect x="238" y="300" width="24" height="80" rx="12" fill="#5b4cdb"/>
        </svg>
        <h1>آپارتمان پلاس</h1>
        <p>نرم‌افزار هوشمند مدیریت ساختمان</p>
      </div>

      <!-- تب‌ها -->
      <div class="login-tabs">
        <button class="login-tab active" data-login-tab="login">🔑 ورود</button>
        <button class="login-tab" data-login-tab="signup">✨ ثبت‌نام</button>
      </div>

      <!-- تب ورود -->
      <div class="login-tab-content active" data-login-tab-content="login">
        <div class="form-group">
          <label for="loginPhone">📱 شماره موبایل</label>
          <input type="tel" id="loginPhone" class="form-input"
                 placeholder="۰۹۱۲۱۲۳۴۵۶۷" maxlength="11" dir="ltr" />
          <div class="login-error-msg" id="loginPhoneError"></div>
        </div>

        <div class="form-group">
          <label for="loginPassword">🔒 رمز عبور</label>
          <div class="show-pass-wrapper">
            <input type="password" id="loginPassword" class="form-input"
                   placeholder="••••••••" style="padding-left: 40px;" />
            <button type="button" class="show-pass-btn" data-toggle-pass="loginPassword">👁️</button>
          </div>
          <div class="login-error-msg" id="loginPasswordError"></div>
        </div>

        <button class="login-submit-btn" id="btnLoginSubmit">
          🚀 ورود به پنل
        </button>

        <p class="login-footer-text">
          حساب کاربری نداری؟
          <a data-switch-to-signup>ثبت‌نام کن</a>
        </p>
      </div>

      <!-- تب ثبت‌نام (فقط متن راهنما) -->
      <div class="login-tab-content" data-login-tab-content="signup">
        <div style="text-align: center; padding: 20px 0;">
          <div style="font-size: 56px; margin-bottom: 12px;">✨</div>
          <h2 style="font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 10px;">
            خوش آمدید!
          </h2>
          <p style="font-size: 13.5px; color: #64748b; line-height: 1.8; margin-bottom: 20px;">
            برای شروع، اطلاعات ساختمان خود را وارد کنید. این فرآیند ۴ مرحله دارد و
            کمتر از ۲ دقیقه طول می‌کشد.
          </p>

          <button class="login-submit-btn" id="btnStartSignup">
            🎯 شروع ثبت‌نام
          </button>

          <p class="login-footer-text">
            حساب داری؟
            <a data-switch-to-login>وارد شو</a>
          </p>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/plans.js?v=2"></script>
  <script src="js/auth.js?v=1"></script>
</body>
</html>
